# The issue form for a bug report, which GitHub offers when a new issue is opened; it asks for the sections a bug report has (see
# docs/conventions/github-workflow.md#issues), and presets the "Type: Bug" label, which GitHub only applies when the label exists (see
# docs/development-setup/setting-up-github.md); every other label, the milestone, and the assignee are left to whoever maintains the template, since
# a contributor cannot set them
name: Bug Report
description: Report something in the template, or in a project generated from it, that does not work as described.
labels:
  - "Type: Bug"

# The fields of the form, in the order in which they are shown; each field becomes a section of the issue, headed by its label
body:
  # The guidance for the title, which the form cannot check, and the pointer to the security policy
  - type: markdown
    attributes:
      value: >-
        Give the issue a title in title case that says what is to be done, as in "Fix the Link to the Changelog Article". Report a security
        vulnerability through the security policy instead, never in a public issue.

  # The side of the split the issue concerns, which decides whether a fix reaches every generated project
  - type: dropdown
    id: side
    attributes:
      label: Side of the Split
      description: >-
        A change to the template body reaches every generated project, and a change at the root of the template repository does not (see
        docs/project-template/template-structure.md).
      options:
        - The template body, which is what a generated project contains
        - The template repository itself, such as copier.yml, the documentation, or the continuous integration
        - Not sure
    validations:
      required: true

  # What is wrong, and why it matters, before how to fix it
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, and why it matters.
    validations:
      required: true

  # The steps that reproduce the bug
  - type: textarea
    id: what-was-done
    attributes:
      label: What Was Done
      description: >-
        The steps that lead to the bug, such as the "copier copy" or "copier update" command, its answers, the template version, and the
        Copier version, so that anyone can reproduce it.
    validations:
      required: true

  # What should have happened
  - type: textarea
    id: what-was-expected
    attributes:
      label: What Was Expected
    validations:
      required: true

  # What happened instead
  - type: textarea
    id: what-happened-instead
    attributes:
      label: What Happened Instead
      description: Include any error message as it was printed.
    validations:
      required: true

  # The details the fix needs, which are optional
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Anything the fix needs beyond the description, such as a suspected cause or the files involved.
