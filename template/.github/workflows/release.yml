# Creates the annotated tag and the GitHub Release of a release once its release pull request has been merged into the default branch, and attaches
# the library's package and symbol package to the GitHub Release (see Versioning); the file name stays "release.yml", because a trusted publishing
# policy on nuget.org is bound to it; the name is the display name of the workflow, shown in the "Actions" tab of the GitHub repository and in the
# checks of a commit or pull request

[%- if publish_to_nuget %]
#
# After the GitHub Release, a second job publishes both packages to nuget.org

[%- endif %]
name: Release

# Defines the events that trigger this workflow; it runs when a pull request into the default branch is closed, and its job only when the pull request
# was merged; only a release pull request goes into the default branch, since the "Pull Requests" workflow fails every pull request into it that does
# not come from the integration branch (see GitHub Workflow)
on:
  pull_request:
    types:
      - closed
    branches:
      - "[[ default_branch ]]"

[%- if publish_to_nuget %]

# Grants the workflow's token write access to the repository contents, which pushing the tag and creating the GitHub Release need, and nothing else;
# the job that publishes to nuget.org narrows this down to what it needs itself

[%- else %]

# Grants the workflow's token write access to the repository contents, which pushing the tag and creating the GitHub Release need, and nothing else

[%- endif %]
permissions:
  contents: write

# Never runs two releases at the same time, and never cancels one that is running, since a release that is cancelled halfway may have pushed its tag
# without creating its GitHub Release
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Defines the jobs that make up the workflow
jobs:
  # Checks the release and packs the library, then tags the merge commit and creates the GitHub Release; everything is checked and built before
  # anything is created, so that a release that is not ready, or a library that does not pack, fails without leaving a tag behind; a tag pushed with
  # the workflow's token starts no other workflow, which is why everything happens in this one job; runs on the latest Ubuntu image, which is the
  # fastest and cheapest of the available runners, and whose Python runs the script, which needs nothing but the standard library
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository }}

    # Stops a run that hangs instead of letting it use up the default limit of six hours
    timeout-minutes: 20

[%- if publish_to_nuget %]

    # Passes the tag on to the job that publishes the packages of its GitHub Release
    outputs:
      tag: ${{ steps.release.outputs.tag }}

[%- endif %]

    # The sequence of tasks that are executed as part of the job; the steps run sequentially in the same runner and share the same file system; every
    # action is pinned to the full commit SHA of a release, with the version in a comment, because a tag can be moved to point at different code,
    # while a commit SHA cannot; Dependabot keeps the pins up to date (see Continuous Integration)
    steps:
      # Checks out the merge commit that brought the release into the default branch, which is the commit the tag points at; the checkout keeps the
      # workflow's token in the repository's Git configuration, which is what pushing the tag uses
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Reads the newest release from the changelog, checks that its date is set and that the version is the same everywhere it has to be, and
      # writes the tag message and the release notes; it sets the "version" and "tag" outputs the later steps use (see
      # ".github/scripts/prepare-release.py")
      - name: Prepare Release
        id: release
        run: python3 .github/scripts/prepare-release.py --output-directory "$RUNNER_TEMP/release"

      # Fails if the tag already exists, which means that the release was tagged before, or that a pull request into the default branch was merged
      # without a new release in the changelog; a pushed tag is never moved (see Versioning)
      - name: Check That the Tag Does Not Exist
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists; add the next release to the changelog, or create the GitHub Release by hand"
            exit 1
          fi

      # Installs the .NET SDK; the version is read from "global.json" instead of being duplicated here, so the SDK this workflow builds with can never
      # drift from the exact version pinned there (see Dependency Management)
      - name: Set Up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Restores every project of the solution exactly as it is locked, like the "Tests" workflow does, so that the package is built from the
      # dependencies that were tested
      - name: Restore Dependencies
        run: dotnet restore "source/[[ product_name ]].slnx" --locked-mode

      # Packs every packable project of the solution, which is only the library, in the Release configuration, into the package and the symbol
      # package, and runs its package validation (see Versioning)
      - name: Pack Library
        run: dotnet pack "source/[[ product_name ]].slnx" --no-restore --configuration Release --output "$RUNNER_TEMP/packages"

      # Creates the annotated tag on the merge commit, with the tag message the script wrote, and pushes it; the tag is created by the
      # "github-actions[bot]" account, and it is not signed
      - name: Create and Push Tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$MERGE_COMMIT" --file "$RUNNER_TEMP/release/tag-message.txt"
          git push origin "refs/tags/$TAG"

      # Creates the GitHub Release from the pushed tag, with the package and the symbol package attached; "--verify-tag" fails instead of letting
      # GitHub create a lightweight tag of its own, and the notes are the release's bullets, unwrapped, rather than the tag message, whose subject
      # repeats the title and whose lines are wrapped
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: >
          gh release create "$TAG" --verify-tag --title "Release v$VERSION" --notes-file "$RUNNER_TEMP/release/release-notes.md"
          "$RUNNER_TEMP"/packages/*.nupkg "$RUNNER_TEMP"/packages/*.snupkg

[%- if publish_to_nuget %]

  # Publishes the package and the symbol package of the GitHub Release to nuget.org, through NuGet's trusted publishing, which exchanges a token that
  # GitHub issues for this run for a short-lived API key, so that no API key is stored in the repository (see Setting up GitHub); it is a job of its
  # own, so that only it can request that token, and it publishes exactly the packages attached to the GitHub Release
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: release

    # Runs in the "nuget" environment, which a trusted publishing policy can be restricted to, and which can require a reviewer to approve every
    # publication (see Setting up GitHub); GitHub creates the environment the first time a job uses it
    environment: nuget

    # Reads the packages from the GitHub Release, and requests the token that NuGet's trusted publishing exchanges for an API key
    permissions:
      contents: read
      id-token: write

    # Stops a run that hangs instead of letting it use up the default limit of six hours; the job takes about a minute
    timeout-minutes: 10

    # The steps run on the runner's own .NET SDK, since pushing a package needs no particular version, and there is no checkout whose "global.json"
    # could name one
    steps:
      # Downloads the package and the symbol package from the GitHub Release the release job created, rather than packing the library again, so
      # that what is published to nuget.org is exactly what is attached to the release
      - name: Download Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.nupkg" --pattern "*.snupkg" --dir "$RUNNER_TEMP/packages"

      # Exchanges the token GitHub issued for this run for a temporary nuget.org API key, which is valid for an hour; nuget.org only issues it if a
      # trusted publishing policy matches this repository, this workflow file, and, if the policy names one, this environment; "user" is the
      # nuget.org profile name of the user who created the policy, read from the "NUGET_USER" secret
      - name: Log In to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the package, and with it the symbol package lying next to it, to nuget.org; "--skip-duplicate" lets a re-run of the job succeed when
      # an earlier run already pushed the package, since a published version can never be pushed again
      - name: Push Packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "$RUNNER_TEMP"/packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          --skip-duplicate

[%- endif %]
