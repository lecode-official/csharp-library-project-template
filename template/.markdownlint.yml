# The Markdown linting configuration of the project, which ".github/.markdownlint.yml" extends (see Markdown Linting (MarkdownLint))

# Use the default configuration for all rules
default: true

# The line length rule is not used in this project, as breaking the lines manually takes a lot of work and always has to be redone after updating a
# document, furthermore, many editors allow the auto-breaking of lines to fit the text inside the window, which is optimal for prose
line-length: false

# There are some inline-HTML tags that are allowed, although in general using HTML should be abstained from; <kbd> is for keyboard shortcuts, <div>
# is used to center-align images and text (<div align="center">), and <img> aligns the logo with the title of the read me
no-inline-html:
  allowed_elements:
    - kbd
    - div
    - img

# Checks that every relative link points to a file that exists, and that a link to a heading of another file, as in "article.md#section", points
# to a heading that exists; external links are not checked, so that the linting stays fast and independent of the network; the rule is not built
# into MarkdownLint, but loaded from the npm package "markdownlint-rule-relative-links" by ".markdownlint-cli2.yaml"
relative-links: true
